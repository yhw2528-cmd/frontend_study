<!DOCTYPE html>
<html>
    <head><style type="text/css">
        #apple_static{position: static;}
        #pear_static{position: static;top: 100px;left: 300px;}
        #kiwi_relative{position: relative;left:80px;}
        #mango_absolute{position: absolute;top: 300px;left: 100px;}
        #cherry_fixed{position: fixed;top:30px;right: 30px;}
    </style>
</head>
<body>
    <h3>Apple_static
        <img src="../../images/apple.jpg" id="apple_static" width="60" height="60">
    </h3>
    <p>
        <img src="../../images/pear.jpg" id="pear_static" width="60" height="60">
        pear 그림을 static으로..
    </p>
    <h3>Kiwi와 Mango(Relative와 Absolute)..
        <img src="../../images/kiwi.jpg" id="kiwi_relative" width="60" height="60">
        <img src="../../images/mango.jpg" id="mango_absolute" width="60" height="60">
    </h3>
    <img src="../../images/cherry.jpg" id="cherry_fixed" width="60" height="60">
    <P>Cherry를 fixed로..</P>
</body>
</html>
