<!doctype html>
<html>
    <head>
        <style type="text/css">
            p { font-size: 10pt }
            h3 strong { font-style: italic }   /* h3에 속하는 strong 요소 */
            p strong { color: red }
            /* p에 속하는strong 요소 */
            p > strong { color: blue }
            h3 + p { font-style: italic }
            /* p요소 바로 아래에 속하는strong 요소*/
            /* h3요소바로다음에있는p요소*/
        </style>
    </head>
    <body>
        <h3> <strong>스타일시트</strong> 이해하기</h3>
        css_comb.html
        <p>이 예제는<span id="test"><strong>CSS</strong>의 개념</span>을 설명합니다.
        <br><a href="http://www.w3c.org">가상클래스</a>와 <a href="http://www.tukorea.ac.kr">
        선택자조합</a>으로스타일을지정합니다.</p>
        <p>다음<strong>CSS 속성</strong> 예제로 이어집니다.</p>
    </body>
</html>
