<!DOCTYPE html>
<html>
    <head>
        <style type="text/css">
            ul.outside-list { list-style-position: outside }
            ul.inside-list { list-style-position: inside }
            li.apple { list-style-image: url("../images/apple.jpg") }
            li.pear { list-style-image: url("../images/pear.jpg") }
            p { font-weight: bold }
        </style>
    </head>
    <body>
        <h3>과목별추천도서목록</h3>
        <ul class="outside-list">
            <p>멀티미디어이해</p>
            <li class="pear">최윤철, 임순범 공저, 멀티미디어배움터2.0</li>
            <li class="apple">T.Vaughan, Multimedia: Making It Work, 7th Ed.</li>
            <li class="apple">Z.Li and M.S.Drew, Fundamentals of Multimedia</li>
        </ul>
        <ul class="inside-list">
            <p>인터넷개론</p>
            <li class="pear">최윤철, 임순범 공저, 인터넷배움터2.0</li>
            <li class="pear">임순범 외 공저, HTML5 웹 프로그래밍입문</li>
        </ul>
    </body>
</html>
