<!DOCTYPE html>
<html>
    <head>
        <title>CSS3 Selector Basic Page</title>
        <style>
            .select {color:red;}
            input[type="text"] {background:red;}
            input[type="password"]{background:blue;}
            h1{color: red;}
            p{color:blue;}

        </style>
        <body>
            <h1>CSS 태그 셀렉터</h1>
            <p>구문1: 태그에 대한 셀렉터</p>
            <p>구문2: 색 지정 샘플</p>
            <ul>
                <li class="select">사과</li>
                <li>바나나</li>
                <li class="select">오렌지</li>
                <li>감</li>
            </ul>
            <form>
                <input type="text"/>
                <input type="password"/>
            </form>
        </body>
    </head>
</html>
