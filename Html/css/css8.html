<!DOCTYPE html>
<html>
    <style>
        .under{
            text-decoration: underline red;
        }
        .over{
            text-decoration: wavy overline lime;

        }
        .line{
            text-decoration: line-through;
        }
        .plain{
            text-decoration:none;
        }
        .underover{
            text-decoration: dashed underline overline;
        }
        .thick{
            text-decoration: solid underline purple 4px;
        }
        .blink{
            text-decoration: blink;
        }
    </style>
    <body>
        <p class="under">밑줄을 가지는 텍스트입니다</p>
        <p class="over"> 윗줄을 가지는 텍스트입니다</p>
        <p class="line">취소선을 가지는 텍스트입니다</p>
        <p>기본 스타일과 달리 <a class="plain" href="#"> 이 링크에는 밑줄이 없을 것 입니다</a>
        사용자들은 보통 하이퍼링크 여부를 밑줄로 구분하므로, 앵커에서 밑줄을 제거할 때는 주의해야합니다.</p>
        <p class="underover"> 밑줄과 윗줄 모두 가지는 텍스트입니다.</p>
        <p class="thick">브라우저가 지원하는 경우 아주 두꺼운 보라색 밑줄을 가지게 될 텍스트입니다.</p>
        <p class="blink">이 텍스트는 브라우저에 따라서 깜빡일 수 있습니다.</p>    
    </body>
</html>
