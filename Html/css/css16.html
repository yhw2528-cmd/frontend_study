<!DOCTYPE html>
<html>
    <head><style type="text/css">
        #apple_float {float:left; border:thin solid black;}
        #pear_float{float:left;}
        #kiwi_float{float:right; border: thin solid black;}

    </style></head>
    <body>
        <h3> Float 속성의 사용</h3>
        <img src="../../images/apple.jpg" id="apple_float" width="60" height="60">
        <img src="../../images/pear.jpg" id="pear_float" width="60" height="60">
        <img src="../../images/kiwi.jpg" id="kiwi_float" width="60" height="60">
        <p> Apple은 가장 왼쪽에 자리하고, Pear는 바로 옆에 붙어서 자리를 
            차지하게 된다. kiwi는 오른쪽에 자리를 잡게 된다.</p>
    </body>
</html>
