<!doctype html>
<html>
    <head>
        <style type="text/css">
            p {font-size:10pt}
            a:link { color: blue; }
            a:visited { color: green; }
            /* 방문한a태그의링크*/
            p:last-child  { color: blue; text-align:center; }
            css_pseudo.html
            /* a태그의하이퍼링크*/
            /* 마지막 p요소 */
            p:first-letter { font-size: 12pt; background-color:silver }  /* p요소의 첫글자 */
            h3:before { content: "◆"; color: blue }
            h3:after { content: " (style)"; font-size:10pt }
            /* h3요소의앞에파란색◆문자삽입*/
            /* h3요소의뒤에콘텐츠삽입*/
        </style>
    </head>
    <body>
        <h3><strong>스타일시트</strong> 이해하기</h3>
        <p>이 예제는<strong>CSS</strong>의 개념을 설명합니다.</p>
        <p>선택자에<a href="http://www.w3c.org">가상클래스</a>와
        <a href="http://www.tukorea.ac.kr">선택자 조합</a>을 적용하여 스타일을 지정합니다.</p>
    </body>
</html>
