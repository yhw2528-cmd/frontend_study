<!DOCTYPE html>
<html>
<body>
<script>
var   valueA = 20;                     
// 숫자형을문자열로변환
valueA = String(valueA);      
document.write(valueA + ' ' + typeof valueA + "<br><br>");
var   valueB = true;                   
// 불리언을문자열으로변환
valueB = String(valueB);
document.write(valueB + ' ' + typeof valueB + "<br><br>");
var valueC = '24';                     
// 문자열을숫자형으로변환
valueC = Number(valueC);
document.write(valueC + ' ' + typeof valueC + "<br><br>");
</script>
</body>
</html>
