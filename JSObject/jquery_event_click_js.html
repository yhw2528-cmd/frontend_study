<!DOCTYPE html>
<html>
    <head>
        <script>
            function update(){
                let v=document.getElementById("name");
                v.innerHTML="<em> 변경합니다</em>";
                alert(v.innerHTML);
            }
        </script>
    </head>
    <body>
        <p id="name" onclick="update()">안녕하세요</p>
    </body>
</html>
