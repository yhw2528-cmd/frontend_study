<!DOCTYPE html>
    <html>
        <body>
            <p id="p1">안녕하세요~</p>
            <script>
                function changeStyle() {
                    document.getElementById("p1").style.color = "skyblue";
                    document.getElementById("p1").style.fontFamily = "Georgia";
                    document.getElementById("p1").style.fontStyle = "Times New Roman";

                }
            </script>
            <input type="button" onclick="changeStyle()" value="눌러보세요" />
        </body>
    </html>
