<!DOCTYPE html>
<html>
<body>
    <p class="target">This is a first paragraph.</p>
    <p class="target">This is a second paragraph.</p>
    <p class="target">This is a third paragraph.</p>
    <p class="target">This is a fourth paragraph.</p>
    <p id="result"></p>
    <script>
        let arr = document.querySelectorAll("p.target");
        let text = "";
        for (let i = 0; i < arr.length; i++) {
            text += (i + 1) + "번째 요소: " + arr[i].innerHTML + "<br>";
        }
        document.getElementById("result").innerHTML = text;
    </script>
</body>
</html>
