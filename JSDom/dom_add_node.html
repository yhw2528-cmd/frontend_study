<!DOCTYPE html>
<html>
<head>
    <script>
        function addNode() {
            let input = document.getElementById("text");
            let t = input.value;

            if (t == "") {
                alert("텍스트 창에 입력 값을 넣으세요");
                input.focus();   // 다시 입력받을 수 있게 커서를 입력 창으로
                return;          // 여기서 함수 종료 → <p> 추가 안 됨
            }

            let node = document.createElement("p");
            node.innerHTML = t;
            document.getElementById("target").appendChild(node);
            input.value = ""; 
        }
    </script>
</head>
<body>
    <input type="text" id="text">
    <button onclick="addNode()">클릭</button>
    <div id="target"></div>
</body>
</html>
