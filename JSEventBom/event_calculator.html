<!DOCTYPE html>
<html>
<head>
    <style>
        table { table-layout: fixed; }
        input[type="button"] { width: 100%; height: 50px; }
        #display { width: 100%; height: 40px; box-sizing: border-box; }
    </style>
    <script>
        let expression="";
        function add(charater){
            expression=expression+charater;
            document.getElementById("display").value=expression;
        }
        function compute() {
            document.getElementById("display").value = eval(expression);
        }
        function clearDisplay() {
            expression = "";
            document.getElementById("display").value = "0";
        }
    </script>
</head>
<body>
    <table border="1" width="400">
        <tr>
            <th colspan="4">계산기 프로그램</th>
        </tr>
        <tr>
            <td colspan="4"><input type="text" id="display" value="0"></td>
        </tr>
        <tr>
            <td><input type="button" value="7" onclick="add('7')"></td>
            <td><input type="button" value="8" onclick="add('8')"></td>
            <td><input type="button" value="9" onclick="add('9')"></td>
            <td><input type="button" value="/" onclick="add('/')"></td>
        </tr>
        <tr>
            <td><input type="button" value="4" onclick="add('4')"></td>
            <td><input type="button" value="5" onclick="add('5')"></td>
            <td><input type="button" value="6" onclick="add('6')"></td>
            <td><input type="button" value="*" onclick="add('*')"></td>
        </tr>
        <tr>
            <td><input type="button" value="1" onclick="add('1')"></td>
            <td><input type="button" value="2" onclick="add('2')"></td>
            <td><input type="button" value="3" onclick="add('3')"></td>
            <td><input type="button" value="-" onclick="add('-')"></td>
        </tr>
        <tr>
            <td colspan="2"><input type="button" value="0" onclick="add('0')"></td>
            <td colspan="2"><input type="button" value="+" onclick="add('+')"></td>
        </tr>
        <tr>
            <td colspan="2"><input type="button" value="Clear" onclick="clearDisplay()"></td>
            <td colspan="2"><input type="button" value="Compute" onclick="compute()"></td>
        </tr>
    </table>
</body>
</html>
