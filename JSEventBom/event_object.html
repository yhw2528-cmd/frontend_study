<!DOCTYPE html>
<html>
<body>
    <div id="target" style="background-color:greenyellow;width:200px;height:50px;">
        마우스를올려주세요!</div>
    <script>
    let obj = document.getElementById("target");
    obj.onmouseover= function (e) {
        x=e.clientX;
        y=e.clientY;
        alert(x+" "+y);
        alert(e.type);
        alert(e.target);
    };
    </script>
</body>
</html>
