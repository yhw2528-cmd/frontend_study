<!DOCTYPE html>
<html>
    <body>
        <div onmouseover="mouseOver(this)" onmouseout="mouseOut(this)"
        style="background-color:#efefee; width: 400; height:200px;">
    마우스를 올려주세요!</div>
    <script>
        function mouseOver(obj){
            obj.innerHTML="안녕하세요"
        }
        function mouseOut(obj){
            obj.innerHTML="마우스를 올려주세요!!"
        }
    </script>
    </body>
</html>
